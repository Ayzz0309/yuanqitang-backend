<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>元氣堂傳統整復推拿 — 線上預約</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pu:#5c4f9a;--pu2:#7b6db8;--pu3:#9d8fd0;--pu-pale:#f0edf9;--pu-mid:#e2dcf5;
  --gold:#c9a84c;--gold2:#f0d080;
  --green:#2d7a52;--green-pale:#eaf4ef;
  --red:#b83232;--red-pale:#fbeaea;
  --text:#1e1a30;--text2:#5a546e;--text3:#9891a8;
  --border:#ddd8ee;--border2:#c8c0e0;
  --bg:#f7f5fd;--white:#ffffff;
  --shadow:0 4px 20px rgba(92,79,154,0.10);
  --shadow2:0 8px 32px rgba(92,79,154,0.18);
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important;}
input,button,select{font-family:'Noto Sans TC',sans-serif;}

/* ===== TOAST / LINE NOTIFY ===== */
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:320px;}
.toast{background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.18);overflow:hidden;animation:slideIn 0.35s ease;border-left:4px solid var(--pu);}
.toast.line-toast{border-left-color:#06c755;}
.toast-header{display:flex;align-items:center;gap:8px;padding:10px 14px 0;}
.toast-app{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;}
.toast-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.toast-line-icon{background:#06c755;}
.toast-sys-icon{background:var(--pu);}
.toast-body{padding:6px 14px 12px;}
.toast-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
.toast-msg{font-size:12px;color:var(--text2);line-height:1.5;}
.toast-time{font-size:11px;color:var(--text3);margin-top:4px;}
@keyframes slideIn{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(110%);opacity:0;}}

/* ===== SPLASH / AUTH ===== */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(150deg,#2c2060 0%,#5c4f9a 55%,#8b7bbf 100%);position:relative;overflow:hidden;}
#auth-screen::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,0.03);top:-100px;right:-120px;}
#auth-screen::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.03);bottom:-80px;left:-80px;}
.auth-logo-wrap{margin-bottom:1.25rem;position:relative;z-index:1;}
.auth-logo-circle{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.12);border:2.5px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;margin:0 auto 0.75rem;}
.auth-logo-circle svg{width:72px;height:72px;}
.auth-brand{color:#fff;font-size:20px;font-weight:900;letter-spacing:1.5px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,0.3);}
.auth-tagline{color:rgba(255,255,255,0.65);font-size:12px;text-align:center;margin-top:4px;letter-spacing:1px;}

.auth-card{background:#fff;border-radius:20px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,0.3);position:relative;z-index:1;overflow:hidden;}
.auth-card-header{padding:1.5rem 1.5rem 0;}
.auth-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;}
.auth-tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:transparent;transition:all 0.2s;}
.auth-tab.active{background:var(--pu);color:#fff;box-shadow:0 2px 8px rgba(92,79,154,0.35);}
.auth-mode-tabs{display:flex;margin-top:1rem;gap:0;border-bottom:1.5px solid var(--border);}
.auth-mode-tab{flex:1;text-align:center;padding:8px 0;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.2s;}
.auth-mode-tab.active{color:var(--pu);border-bottom-color:var(--pu);font-weight:500;}
.auth-body{padding:1.25rem 1.5rem 1.5rem;}
.auth-inp-wrap{margin-bottom:0.9rem;}
.auth-lbl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;}
.auth-inp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--text);transition:border-color 0.2s;background:#fff;}
.auth-inp:focus{outline:none;border-color:var(--pu);}
.auth-inp.error{border-color:var(--red);}
.auth-err{font-size:11px;color:var(--red);margin-top:4px;}
.role-pick{display:flex;gap:8px;margin-bottom:1rem;}
.role-btn{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;transition:all 0.2s;}
.role-btn.active{border-color:var(--pu);background:var(--pu-pale);}
.role-btn .rb-icon{font-size:22px;margin-bottom:4px;}
.role-btn .rb-label{font-size:12px;font-weight:500;color:var(--text2);}
.role-btn.active .rb-label{color:var(--pu);}
.auth-submit{width:100%;background:linear-gradient(135deg,var(--pu),var(--pu2));color:#fff;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:opacity 0.2s;margin-top:0.25rem;}
.auth-submit:hover{opacity:0.9;}
.auth-hint{font-size:11px;color:var(--text3);text-align:center;margin-top:10px;}
.auth-divider{display:flex;align-items:center;gap:8px;margin:0.75rem 0;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-divider span{font-size:11px;color:var(--text3);}

/* ===== APP HEADER ===== */
#app-header{background:linear-gradient(135deg,#2c2060,var(--pu));padding:0.8rem 1rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(44,32,96,0.4);}
.hdr-logo{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hdr-logo svg{width:28px;height:28px;}
.hdr-info{flex:1;min-width:0;}
.hdr-name{color:#fff;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-user{color:rgba(255,255,255,0.65);font-size:11px;}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hdr-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-boss{background:var(--gold2);color:#5a3800;}
.badge-staff{background:rgba(255,255,255,0.2);color:#fff;}
.badge-cust{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9);}
.hdr-logout{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;}

/* ===== CUSTOMER APP ===== */
#cust-app{max-width:430px;margin:0 auto;padding-bottom:4rem;}
.step-bar{display:flex;align-items:center;padding:1rem 1.25rem;}
.sd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all 0.3s;}
.sd.done{background:var(--pu);color:#fff;}
.sd.act{background:var(--pu);color:#fff;box-shadow:0 0 0 5px var(--pu-pale);}
.sd.pend{background:var(--border);color:var(--text3);}
.sl{flex:1;height:2px;background:var(--border);transition:background 0.3s;}
.sl.done{background:var(--pu);}

.sc{background:#fff;border-radius:18px;margin:0.6rem 0.9rem;padding:1.25rem;box-shadow:var(--shadow);border:1px solid var(--border);}
.sc-lbl{font-size:11px;font-weight:700;color:var(--pu);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:1rem;}

.cat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0.9rem;}
.cat-pill{display:inline-flex;padding:5px 12px;border-radius:20px;background:var(--pu-pale);color:var(--pu);font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all 0.2s;}
.cat-pill.act{background:var(--pu);color:#fff;}

.svc-item{border:1.5px solid var(--border);border-radius:13px;padding:1rem;margin-bottom:0.5rem;cursor:pointer;transition:all 0.2s;position:relative;}
.svc-item:hover{border-color:var(--pu3);background:var(--pu-pale);}
.svc-item.sel{border-color:var(--pu);background:var(--pu-pale);}
.svc-name{font-size:14px;font-weight:700;color:var(--text);}
.svc-sub{font-size:11px;color:var(--text3);margin-top:2px;margin-bottom:7px;}
.price-chips{display:flex;flex-wrap:wrap;gap:5px;}
.pchip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;}
.pchip:hover{border-color:var(--pu);}
.pchip.sel{background:var(--pu);color:#fff;border-color:var(--pu);}
.svc-chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all 0.2s;}
.svc-item.sel .svc-chk{background:var(--pu);border-color:var(--pu);color:#fff;}

.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;}
.cal-nav{background:none;border:1px solid var(--border);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--text2);}
.cal-ttl{font-size:14px;font-weight:700;color:var(--text);}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.clbl{font-size:11px;color:var(--text3);text-align:center;padding:4px 0;font-weight:600;}
.cday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:8px;cursor:pointer;color:var(--text);border:1px solid transparent;transition:all 0.15s;}
.cday:hover{background:var(--pu-pale);}
.cday.sel{background:var(--pu);color:#fff;}
.cday.tod{border-color:var(--pu);color:var(--pu);font-weight:700;}
.cday.past{color:var(--border);cursor:default;}

.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0.75rem;}
.tbtn{border:1.5px solid var(--border);border-radius:11px;padding:10px;text-align:center;cursor:pointer;transition:all 0.15s;}
.tbtn:hover{border-color:var(--pu2);}
.tbtn.sel{background:var(--pu);border-color:var(--pu);color:#fff;}
.tbtn.sel .tavail{color:rgba(255,255,255,0.75);}
.tval{font-size:15px;font-weight:700;}
.tavail{font-size:11px;color:var(--text3);margin-top:2px;}

.fg{margin-bottom:0.9rem;}
.flbl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;}
.finp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--text);}
.finp:focus{outline:none;border-color:var(--pu);}

.sum-box{background:var(--pu-pale);border-radius:12px;padding:1rem;margin-bottom:1rem;border:1px solid var(--pu-mid);}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(92,79,154,0.08);}
.sum-row:last-child{border:none;font-weight:700;color:var(--pu);font-size:15px;padding-top:8px;}
.sum-lbl{color:var(--text2);}

.pbtn{width:100%;background:linear-gradient(135deg,var(--pu),var(--pu2));color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:opacity 0.2s;}
.pbtn:disabled{opacity:0.35;cursor:not-allowed;}
.pbtn:hover:not(:disabled){opacity:0.9;}
.sbtn{width:100%;background:transparent;border:1.5px solid var(--border);border-radius:12px;padding:11px;font-size:13px;color:var(--text2);cursor:pointer;margin-top:8px;}

.success-wrap{text-align:center;padding:2rem 1rem;}
.success-ring{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--pu2));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:0 8px 24px rgba(92,79,154,0.35);}
.success-h{font-size:20px;font-weight:900;margin-bottom:6px;}
.success-p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:1.25rem;}
.line-tip{background:#edfaf3;border:1px solid #a8e0c0;border-radius:10px;padding:0.75rem 1rem;font-size:12px;color:var(--green);margin-bottom:1rem;text-align:left;}

/* ===== STAFF APP ===== */
#staff-app{max-width:480px;margin:0 auto;padding-bottom:4rem;}
.staff-nav{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:56px;z-index:100;overflow-x:auto;}
.snav-btn{flex-shrink:0;padding:11px 14px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;border:none;background:none;transition:all 0.2s;font-family:'Noto Sans TC',sans-serif;}
.snav-btn.act{color:var(--pu);border-bottom-color:var(--pu);}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-left:3px;vertical-align:middle;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0.75rem 0.9rem;}
.stat-c{background:#fff;border-radius:12px;padding:0.85rem 0.5rem;text-align:center;border:1px solid var(--border);}
.stat-n{font-size:20px;font-weight:900;color:var(--pu);}
.stat-l{font-size:10px;color:var(--text3);margin-top:3px;}

.bcard{background:#fff;border-radius:14px;margin:0.6rem 0.9rem;border:1.5px solid var(--border);overflow:hidden;transition:box-shadow 0.2s;}
.bcard.is-new{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,168,76,0.18);}
.bcard-top{padding:1rem 1rem;display:flex;gap:10px;align-items:flex-start;}
.bcard-av{width:42px;height:42px;border-radius:50%;background:var(--pu-pale);border:1.5px solid var(--pu-mid);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--pu);flex-shrink:0;}
.bcard-info{flex:1;min-width:0;}
.bcard-name{font-size:15px;font-weight:700;}
.bcard-svc{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4;}
.bcard-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.tag{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:600;}
.tag-t{background:#eef2ff;color:#2244aa;}
.tag-p{background:var(--green-pale);color:var(--green);}
.tag-d{background:var(--pu-pale);color:var(--pu);}
.tag-e{background:#fff8e0;color:#7a5000;}
.bcard-contact{font-size:11px;color:var(--text3);margin-top:5px;}
.bcard-note{font-size:11px;color:var(--text2);background:var(--pu-pale);border-radius:6px;padding:4px 8px;margin-top:5px;}
.bcard-status{flex-shrink:0;}
.sbadge{padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.sb-new{background:#fff3e0;color:#c07000;}
.sb-acc{background:var(--green-pale);color:var(--green);}
.sb-dec{background:var(--red-pale);color:var(--red);}
.sb-don{background:var(--pu-pale);color:var(--pu);}
.bcard-acts{border-top:1px solid var(--border);padding:0.65rem 1rem;display:flex;gap:6px;}
.abtn{flex:1;padding:9px 0;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans TC',sans-serif;transition:all 0.15s;}
.abtn-acc{background:var(--green);color:#fff;}
.abtn-dec{background:var(--red-pale);color:var(--red);border:1px solid #e8b0b0;}
.abtn-done{background:var(--pu-pale);color:var(--pu);border:1px solid var(--pu-mid);}

/* Staff table */
.staff-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.staff-tbl th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:600;border-bottom:1.5px solid var(--border);background:var(--bg);}
.staff-tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.staff-tbl tr:last-child td{border-bottom:none;}
.staff-row:hover td{background:var(--pu-pale);}
.emp-av{width:32px;height:32px;border-radius:50%;background:var(--pu-pale);border:1.5px solid var(--pu-mid);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--pu);}
.boss-mark{background:var(--gold2);color:#5a3800;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700;margin-left:4px;}

.section-title{font-size:13px;font-weight:700;color:var(--text);padding:0.9rem 0.9rem 0.4rem;}
.empty{text-align:center;padding:3rem 2rem;color:var(--text3);}
.empty-ico{font-size:36px;margin-bottom:0.75rem;}

/* LINE notification panel inside staff */
.line-log{background:#edfaf3;border-radius:12px;margin:0.6rem 0.9rem;overflow:hidden;border:1px solid #b0dcc0;}
.line-log-hdr{background:#06c755;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.line-log-hdr span{color:#fff;font-size:13px;font-weight:700;}
.line-msg{padding:10px 14px;border-bottom:1px solid #c8eedd;font-size:12px;color:#1a4a2e;}
.line-msg:last-child{border-bottom:none;}
.line-msg-time{font-size:10px;color:#3a7a52;margin-bottom:2px;font-weight:600;}

/* Boss-only manage employees */
.emp-manage-card{background:#fff;border-radius:13px;margin:0.6rem 0.9rem;border:1px solid var(--border);padding:1rem;}


/* ── 床位時間表 ── */
.bed-timeline{overflow-x:auto;padding:0 0.9rem 0.5rem;}
.bt-wrap{min-width:520px;}
.bt-header{display:grid;grid-template-columns:64px repeat(9,1fr);gap:3px;margin-bottom:4px;}
.bt-hlbl{font-size:10px;color:var(--text3);text-align:center;padding:4px 0;font-weight:600;}
.bt-row{display:grid;grid-template-columns:64px repeat(9,1fr);gap:3px;margin-bottom:4px;}
.bt-bed-lbl{font-size:12px;font-weight:700;color:var(--pu);display:flex;align-items:center;padding:0 4px;}
.bt-cell{border-radius:6px;padding:5px 3px;text-align:center;font-size:10px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;}
.bt-empty{background:var(--bg);border:1px dashed var(--border);}
.bt-booked{background:var(--pu-pale);border:1px solid var(--pu-mid);color:var(--pu);font-weight:600;}
.bt-done{background:#f0f0f0;border:1px solid #ddd;color:var(--text3);}
.bt-my{background:linear-gradient(135deg,var(--pu),var(--pu2));color:#fff;border:none;}

/* ── 客人預約紀錄 ── */
.my-booking-card{background:#fff;border-radius:13px;margin:0.5rem 0.9rem;border:1.5px solid var(--border);overflow:hidden;}
.mbc-top{padding:0.9rem 1rem;display:flex;gap:10px;align-items:flex-start;}
.mbc-icon{width:38px;height:38px;border-radius:50%;background:var(--pu-pale);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.mbc-info{flex:1;}
.mbc-svc{font-size:14px;font-weight:700;color:var(--text);}
.mbc-meta{font-size:12px;color:var(--text2);margin-top:3px;}
.mbc-cancel{border-top:1px solid var(--border);padding:0.6rem 1rem;}
.cancel-btn{width:100%;background:var(--red-pale);color:var(--red);border:1px solid #e8b0b0;border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}

/* ── 手動預約 ── */
.manual-form{background:#fff;border-radius:14px;margin:0.6rem 0.9rem;border:1px solid var(--border);padding:1.25rem;}

/* ── 報表 ── */
.chart-bar-wrap{margin:0 0.9rem 1rem;}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.chart-bar-lbl{font-size:12px;color:var(--text2);width:60px;flex-shrink:0;text-align:right;}
.chart-bar-track{flex:1;background:var(--bg);border-radius:20px;height:22px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pu),var(--pu2));display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600;transition:width 0.5s ease;min-width:30px;}
.report-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0.9rem;margin-bottom:1rem;}
.report-card{background:#fff;border-radius:12px;padding:0.9rem;border:1px solid var(--border);}
.rc-num{font-size:22px;font-weight:900;color:var(--pu);}
.rc-lbl{font-size:11px;color:var(--text3);margin-top:3px;}
.rc-sub{font-size:12px;color:var(--green);font-weight:600;margin-top:2px;}

/* ── 客人名單 ── */
.cust-row{display:flex;align-items:center;gap:10px;padding:0.75rem 1rem;border-bottom:1px solid var(--border);}
.cust-row:last-child{border-bottom:none;}
.cust-av{width:36px;height:36px;border-radius:50%;background:var(--pu-pale);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--pu);flex-shrink:0;}
.cust-info{flex:1;}
.cust-name{font-size:14px;font-weight:600;}
.cust-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.cust-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;}
.cb-new{background:#fff8e0;color:#c07000;}
.cb-regular{background:var(--green-pale);color:var(--green);}
.cb-vip{background:var(--pu-pale);color:var(--pu);}

/* ── 公休設定 ── */
.holiday-chip{display:inline-flex;align-items:center;gap:5px;background:var(--red-pale);color:var(--red);border:1px solid #e8b0b0;border-radius:20px;padding:4px 10px;font-size:12px;margin:4px;}
.holiday-chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0;line-height:1;}
</style>
</head>

function getShiftLabel(therapistId, dateStr){
  if(!dateStr) return '請先選擇日期時段';
  const parts = dateStr.split('/');
  if(parts.length < 2) return '';
  const month = parseInt(parts[0]);
  const day = parseInt(parts[1]);
  if(month !== 5) return '排班未設定';
  const sched = SCHEDULE_2026_05[therapistId];
  if(!sched) return '排班未設定';
  const dayInfo = sched[day];
  if(!dayInfo || dayInfo === 'OFF') return '😴 今日休假';
  if(dayInfo === '17') return '⏰ 上班：09:30–14:00';
  if(dayInfo === '18') return '⏰ 上班：19:00–22:00';
  const rp = dayInfo.split('-');
  if(rp.length===2) return `⏰ 上班：${rp[0]}:00–${rp[1]}:00`;
  return '上班中';
}

function isTherapistWorking(therapistId, dateStr, timeStr){
  // dateStr like "5/15", timeStr like "14:00"
  const parts = dateStr.split('/');
  if(parts.length < 2) return true;
  const month = parseInt(parts[0]);
  const day = parseInt(parts[1]);
  if(month !== 5) return true; // 只有5月有排班表
  const sched = SCHEDULE_2026_05[therapistId];
  if(!sched) return true; // 郭老師、洪老師沒排班資料，預設可接
  const dayInfo = sched[day];
  if(!dayInfo || dayInfo === 'OFF') return false;
  // 解析時段
  const hour = parseInt(timeStr.split(':')[0]);
  if(dayInfo === '17') return hour >= 9 && hour < 14; // 09:30-14:00
  if(dayInfo === '18') return hour >= 19; // 19:00-22:00
  // 格式 "10-22" or "14-21"
  const rangeParts = dayInfo.split('-');
  if(rangeParts.length === 2){
    const start = parseInt(rangeParts[0]);
    const end = parseInt(rangeParts[1]);
    return hour >= start && hour < end;
  }
  return true;
}

  let h=['日','一','二','三','四','五','六'].map(d=>`<div class="clbl">${d}</div>`).join('');
  for(let i=0;i<first;i++) h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const isPast=new Date(y,m,d)<new Date(tod.getFullYear(),tod.getMonth(),tod.getDate());
    const isT=d===tod.getDate()&&m===tod.getMonth()&&y===tod.getFullYear();
    const isSel=bookState.date===d&&bookState.calM===m;
    const holKey=y+'/'+(m+1)+'/'+d;

  const dotMap = {'1':1,'2':2,'2c':3,'2b':4,'3':4,'4':5,'5':6};

      <div style="width:48px;height:48px;border-radius:12px;background:${sel?'var(--pu)':taken?'var(--border)':'var(--pu-pale)'};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${bed.icon}</div>
      <div style="flex:1">
        <div class="svc-name">${bed.label}</div>
        <div class="svc-sub">${taken?'⛔ 此時段已有客人使用':'✅ 可預約'}</div>

  }).join('');
}

function selBed(id){
  bookState.bed = id;
  document.getElementById('cs2c-btn').disabled = false;
  renderBeds();
}

function renderTherapists(){
  const sel = bookState.therapist;
  const selectedDate = bookState.date ? (bookState.calM+1)+'/'+bookState.date : '';
  const selectedTime = bookState.time || '';
  const container = document.getElementById('therapist-list');
  if(!container) return;
  container.innerHTML = '';

  function makeCard(id, avatar, name, subText, disabled){
    const div = document.createElement('div');
    div.className = 'svc-item' + (sel===id ? ' sel' : '');
    div.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:0.5rem;'
      + (disabled ? 'opacity:0.4;cursor:not-allowed;background:#f5f5f5;' : '');
    if(!disabled) div.onclick = function(){ selTherapist(id); };

    const avDiv = document.createElement('div');
    avDiv.style.cssText = 'width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:'+(id==='none'?'18':'14')+'px;font-weight:700;flex-shrink:0;'
      + (disabled ? 'background:var(--border);color:var(--text3);' : id==='none' ? 'background:var(--border);' : 'background:var(--pu-pale);border:1.5px solid var(--pu-mid);color:var(--pu);');
    avDiv.textContent = avatar;

    const infoDiv = document.createElement('div');
    infoDiv.style.flex = '1';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'svc-name';
    nameDiv.textContent = name;
    const subDiv = document.createElement('div');
    subDiv.className = 'svc-sub';
    subDiv.style.color = disabled ? 'var(--red)' : 'var(--text3)';
    subDiv.textContent = subText;
    infoDiv.appendChild(nameDiv);
    infoDiv.appendChild(subDiv);

    const chkDiv = document.createElement('div');
    chkDiv.className = 'svc-chk';
    chkDiv.textContent = sel===id ? '✓' : '';

    div.appendChild(avDiv);
    div.appendChild(infoDiv);
    div.appendChild(chkDiv);
    return div;
  }

  // 說明文字
  const hint = document.createElement('div');
  hint.style.cssText = 'margin-bottom:0.9rem;font-size:13px;color:var(--text2)';
  hint.textContent = '可依個人喜好指定師傅，休假中師傅無法指定';
  container.appendChild(hint);

  // 不指定
  container.appendChild(makeCard('none', '🎲', '不指定師傅', '由當天上班師傅承接', false));

  // 各師傅
  THERAPISTS.forEach(function(t){
    const working = !selectedDate || isTherapistWorking(t.id, selectedDate, selectedTime);
    const disabled = !working;
    const shiftLbl = disabled ? '😴 今日休假 / 非上班時段' : getShiftLabel(t.id, selectedDate);
    container.appendChild(makeCard(t.id, t.avatar, t.name, shiftLbl, disabled));
  });
}

function selTherapist(id){
  bookState.therapist = id;
  renderTherapists();
}

function renderSummary(){

function submitBook(){
  const bId='B'+String(bookings.length+1).padStart(3,'0');
  const dateStr=`${MN[bookState.calM]}/${bookState.date}`;
  const b={
    id:bId, custId:cur.user.id, name:cur.user.name, phone:cur.user.phone,
    svc:bookState.svc.name, dur:bookState.price.l, price:bookState.price.p,
    date:dateStr, time:bookState.time, status:'new',
    lineId:cur.user.lineId||'', note:document.getElementById('cs3-note').value,
    bed: bookState.bed,
    therapistId: bookState.therapist==='none'?null:bookState.therapist,
    therapistName: bookState.therapist==='none'?null:(THERAPISTS.find(t=>t.id===bookState.therapist)?.name||null),
    acceptedBy:null, acceptedAt:null
  };
  bookings.unshift(b);

  const nowT=now();
  const custMsg=`【元氣堂】預約成功！\n療程：${b.svc} ${b.dur}\n日期：${b.date} ${b.time}\n費用：NT$${b.price}\n我們會盡快確認並通知您 📞`;
  const staffMsg=`【新預約通知】${nowT}\n客人：${b.name}\n電話：${b.phone}\n療程：${b.svc} ${b.dur}\n日期：${b.date} ${b.time}\n費用：NT$${b.price}${b.note?'\n備註：'+b.note:''}`;
  fetch(LINE_CONFIG.backendUrl+'/api/notify/new-booking', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:b.name,phone:b.phone,svc:b.svc,dur:b.dur,date:b.date,time:b.time,price:b.price,note:b.note,therapistName:b.therapistName,bed:b.bed})
  }).catch(e=>console.error('通知失敗',e));
  setTimeout(()=>toast(custMsg,'line',`${cur.user.name} 的預約確認`),600);
  setTimeout(()=>toast(staffMsg,'line','新預約通知給員工'),1400);
  lineLog.unshift({to:'客人',name:b.name,msg:custMsg,time:nowT});

  document.getElementById('success-msg').innerHTML=`<strong>${cur.user.name}</strong>，預約已送出！<br>員工確認後會再通知您。`;
  document.getElementById('success-sum').innerHTML=`
    <div class="sum-row"><span class="sum-lbl">療程</span><span>${b.svc}</span></div>
    <div class="sum-row"><span class="sum-lbl">日期時段</span><span>${b.date} ${b.time}</span></div>
    <div class="sum-row"><span class="sum-lbl">費用</span><span>NT$${b.price}</span></div>`;
  showStep(5);
}

function resetBook(){
  bookState={step:1,svc:null,price:null,date:null,time:null,therapist:'none',bed:null,calY:new Date().getFullYear(),calM:new Date().getMonth(),catFilter:'all'};
  initCustApp();
}

// ===== STAFF APP =====
function initStaffApp(){
  staffTab='pending';
  renderStaffNav();
  renderStaffContent();
}

function renderStaffNav(){
  const isBoss=cur.user.role==='boss';
  const newCount=bookings.filter(b=>b.status==='new').length;
  const tabs=[
    {k:'pending',l:'待確認',dot:newCount>0},
    {k:'accepted',l:'已接受'},
    {k:'schedule',l:'班表'},
    {k:'timeline',l:'床位表'},
    {k:'today',l:'今日'},
    {k:'manual',l:'手動預約'},
    {k:'linelog',l:'LINE'},
    {k:'stats',l:'報表'},
    {k:'customers',l:'客人'},
  ];
  if(isBoss) tabs.push({k:'employees',l:'員工'},{k:'holidays',l:'公休'});
  document.getElementById('staff-nav').innerHTML=tabs.map(t=>`
    <button class="snav-btn ${staffTab===t.k?'act':''}" onclick="swStaffTab('${t.k}')">${t.l}${t.dot?'<span class="ndot"></span>':''}</button>`).join('');
}

function swStaffTab(t){
  staffTab=t;
  renderStaffNav();
  renderStaffContent();
}

function renderStaffContent(){
  let html='';
  const isBoss=cur.user.role==='boss';
  const todayStr='4/'+new Date().getDate();

  if(staffTab==='pending'){
    const list=bookings.filter(b=>b.status==='new');
    html=statsRow()+( list.length?list.map(bCard).join(''):`<div class="empty"><div class="empty-ico">🎉</div>目前沒有待確認預約</div>`);
  } else if(staffTab==='accepted'){
    const list=bookings.filter(b=>b.status==='accepted');
    html=list.length?list.map(bCard).join(''):`<div class="empty"><div class="empty-ico">📋</div>目前沒有已接受預約</div>`;
  } else if(staffTab==='today'){
    const list=bookings.filter(b=>b.date===todayStr||b.date==='4/20');
    html=list.length?list.map(bCard).join(''):`<div class="empty"><div class="empty-ico">☀️</div>今天沒有排程</div>`;
  } else if(staffTab==='linelog'){
    html=renderLineLog();
  } else if(staffTab==='stats'){
    html=renderStats(isBoss);
  } else if(staffTab==='employees'&&isBoss){
    html=renderEmployees();
  }
  document.getElementById('staff-content').innerHTML=html;
}

function statsRow(){
  const newC=bookings.filter(b=>b.status==='new').length;
  const accC=bookings.filter(b=>b.status==='accepted').length;
  const total=bookings.filter(b=>b.status!=='declined').reduce((s,b)=>s+b.price,0);
  return `<div class="stats-grid">
    <div class="stat-c"><div class="stat-n">${newC}</div><div class="stat-l">待確認</div></div>
    <div class="stat-c"><div class="stat-n">${accC}</div><div class="stat-l">進行中</div></div>
    <div class="stat-c"><div class="stat-n">$${(total/1000).toFixed(1)}k</div><div class="stat-l">總金額</div></div>
  </div>`;
}

function bCard(b){
  const stMap={new:'sb-new',accepted:'sb-acc',declined:'sb-dec',done:'sb-don'};
  const stLbl={new:'待確認',accepted:'已接受',declined:'已婉拒',done:'已完成'};
  const emp=b.acceptedBy?employees.find(e=>e.id===b.acceptedBy):null;
  const myEmpId = cur.user.id;
  const isDesignated = b.therapistId && b.therapistId !== null;
  const canAccept = !isDesignated || b.therapistId === myEmpId;
  const designatedName = b.therapistName || '';
  const actions = b.status==='new'
    ? `<div class="bcard-acts">
        ${canAccept
          ? `<button class="abtn abtn-acc" onclick="acceptBook('${b.id}')">✓ 我接這件</button>
             <button class="abtn abtn-dec" onclick="declineBook('${b.id}')">✗ 婉拒</button>`
          : `<div style="flex:1;text-align:center;font-size:12px;color:var(--text3);padding:8px">🔒 客人已指定 ${designatedName}，僅限該師傅接案</div>`
        }
       </div>`
    : b.status==='accepted'
    ? `<div class="bcard-acts"><button class="abtn abtn-done" onclick="doneBook('${b.id}')">✓ 標記完成</button></div>`
    : '';
  return `<div class="bcard ${b.status==='new'?'is-new':''}" id="bc-${b.id}">
    <div class="bcard-top">
      <div class="bcard-av">${b.name[0]}</div>
      <div class="bcard-info">
        <div class="bcard-name">${b.name}</div>
        <div class="bcard-svc">${b.svc}</div>
        <div class="bcard-tags">
          <span class="tag tag-d">${b.date}</span>
          <span class="tag tag-t">${b.time} · ${b.dur}</span>
          <span class="tag tag-p">NT$${b.price}</span>
          ${emp?`<span class="tag tag-e">👤 ${emp.id} ${emp.name}</span>`:''}
          ${b.bed?`<span class="tag" style="background:#f0f8ff;color:#2255cc">🛏️ ${b.bed}號床</span>`:''}
          ${b.therapistId?`<span class="tag" style="background:#fff0f8;color:#c2547a">🎯 指定：${b.therapistName}</span>`:''}
        </div>
        <div class="bcard-contact">📞 ${b.phone}${b.lineId?' ・ LINE '+b.lineId:''}</div>
        ${b.note?`<div class="bcard-note">備註：${b.note}</div>`:''}
      </div>
      <span class="sbadge ${stMap[b.status]}">${stLbl[b.status]}</span>
    </div>
    ${actions}
  </div>`;
}

function acceptBook(id){
  const b=bookings.find(x=>x.id===id);
  if(!b) return;
  const emp=cur.user;
  const nowT=now();
  b.status='accepted'; b.acceptedBy=emp.id; b.acceptedAt=nowT;
  emp.cases.push(id);

  const custMsg = buildCustConfirmMsg(b, emp.name, emp.id);
  const staffMsg = buildStaffAcceptMsg(b, emp);
  // 發送到真實後端
  fetch(LINE_CONFIG.backendUrl+'/api/notify/accepted', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({empId:emp.id,empName:emp.name,name:b.name,phone:b.phone,svc:b.svc,dur:b.dur,date:b.date,time:b.time,price:b.price,note:b.note})
  }).catch(e=>console.error('通知失敗',e));
  setTimeout(()=>toast(custMsg,'line',`${b.name} 預約確認通知`),400);
  setTimeout(()=>toast(staffMsg,'line',`接案確認 - ${emp.name}`),1200);
  lineLog.unshift({to:'客人',name:b.name,msg:custMsg,time:nowT});
  lineLog.unshift({to:'員工',name:emp.name,msg:staffMsg,time:nowT});

  renderStaffNav();
  renderStaffContent();
}

function declineBook(id){
  const b=bookings.find(x=>x.id===id);
  if(b){b.status='declined';}
  renderStaffNav(); renderStaffContent();
}

function doneBook(id){
  const b=bookings.find(x=>x.id===id);
  if(b){b.status='done';}
  renderStaffContent();
}


// ── 客人導覽 ──
function custNav(tab, el){
  document.querySelectorAll('#cn-book,#cn-history').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  const hist = document.getElementById('cust-history');
  if(hist) hist.classList.toggle('hidden', tab!=='history');
  if(tab==='history'){
    // 隱藏所有預約步驟
    ['cs1','cs2','cs2c','cs2b','cs3','cs4','cs5'].forEach(id=>{
      const e=document.getElementById(id);if(e)e.classList.add('hidden');
    });
    renderMyBookings();
  } else {
    // 回到預約頁：重置到第一步
    bookState.step=1;
    bookState.svc=null; bookState.price=null;
    bookState.date=null; bookState.time=null;
    bookState.therapist='none'; bookState.bed=null;
    ['cs2','cs2c','cs2b','cs3','cs4','cs5'].forEach(id=>{
      const e=document.getElementById(id);if(e)e.classList.add('hidden');
    });
    const cs1=document.getElementById('cs1');
    if(cs1) cs1.classList.remove('hidden');
    // 重置步驟點
    for(let i=1;i<=6;i++){
      const d=document.getElementById('sd'+i);
      if(d) d.className='sd '+(i===1?'act':'pend');
      if(i<6){const l=document.getElementById('sl'+i);if(l)l.className='sl';}
    }
    renderSvcs();
    document.getElementById('cs1-btn').disabled=true;
  }
}

function renderMyBookings(){
  const myB = bookings.filter(b=>b.custId===cur.user.id).sort((a,b)=>b.id.localeCompare(a.id));
  const stLbl={new:'等待確認',accepted:'已確認',declined:'已婉拒',done:'已完成'};
  const stColor={new:'var(--gold)',accepted:'var(--green)',declined:'var(--red)',done:'var(--text3)'};
  if(!myB.length){
    document.getElementById('my-bookings-list').innerHTML=`<div class="empty"><div class="empty-ico">📋</div>還沒有預約紀錄</div>`;
    return;
  }
  document.getElementById('my-bookings-list').innerHTML = myB.map(b=>`
    <div class="my-booking-card">
      <div class="mbc-top">
        <div class="mbc-icon">💆</div>
        <div class="mbc-info">
          <div class="mbc-svc">${b.svc}</div>
          <div class="mbc-meta">${b.date} ${b.time} ・ ${b.dur} ・ NT$${b.price}</div>
          <div class="mbc-meta">${b.bed?b.bed+'號床 ・':''}${b.therapistName?'指定 '+b.therapistName:''}</div>
        </div>
        <span style="font-size:11px;font-weight:700;color:${stColor[b.status]}">${stLbl[b.status]}</span>
      </div>
      ${b.status==='new'||b.status==='accepted'?`
      <div class="mbc-cancel">
        <button class="cancel-btn" onclick="cancelMyBooking('${b.id}')">取消此預約</button>
      </div>`:''}

}

function cancelMyBooking(id){
  if(!confirm('確定要取消這個預約嗎？')) return;
  const b=bookings.find(x=>x.id===id);
  if(b){
    b.status='declined';
    const t=now();
    const msg=`【元氣堂】預約取消通知 ${t}\n客人：${b.name}\n療程：${b.svc} ${b.dur}\n日期：${b.date} ${b.time}\n此預約已由客人取消`;
    fetch(LINE_CONFIG.backendUrl+'/api/notify/new-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:b.name+'（取消）',phone:b.phone,svc:b.svc,dur:b.dur,date:b.date,time:b.time,price:0,note:'⚠️ 客人已取消此預約'})}).catch(()=>{});
    toast('預約已取消，已通知店家','sys','取消成功');
  }
  renderMyBookings();
}

  }

    for(let d=1;d<=31;d++){
      const val = sched[d];
      const isOff = !val || val==='OFF';

      let color = isOff ? '#ccc' : isMorning ? '#2255aa' : isEvening ? 'var(--pu)' : 'var(--green)';
      let lbl = isOff ? '△' : isMorning ? '早' : isEvening ? '晚' : '全';
      out += '<td style="text-align:center;padding:4px 1px;background:'+bg+';color:'+color+';font-weight:600">'+lbl+'</td>';
    }
    out += '</tr>';
  });

  out += '</tbody></table></div>';
  out += '<div style="display:flex;gap:12px;flex-wrap:wrap;padding:0.75rem 0.9rem;font-size:11px;color:var(--text2)">';
  out += '<span><span style="display:inline-block;width:14px;height:14px;background:#e8f4fd;border-radius:3px;vertical-align:middle;margin-right:3px"></span>早班 09:30–14:00</span>';
  out += '<span><span style="display:inline-block;width:14px;height:14px;background:#f0edf9;border-radius:3px;vertical-align:middle;margin-right:3px"></span>晚班 19:00–22:00</span>';
  out += '<span><span style="display:inline-block;width:14px;height:14px;background:#edf9f0;border-radius:3px;vertical-align:middle;margin-right:3px"></span>全天班</span>';
  out += '<span><span style="display:inline-block;width:14px;height:14px;background:#f5f5f5;border-radius:3px;vertical-align:middle;margin-right:3px"></span>△ 休假</span>';
  out += '</div>';
  return out;
}

function renderTimeline(){
  const todayStr = '4/'+new Date().getDate();
  const slots = ['10:00','11:00','12:30','14:00','15:30','17:00','18:30','20:00','21:00'];
  const beds = [1,2,3];
  let html = `<div class="section-title">今日床位時間表</div>
    <div class="bed-timeline"><div class="bt-wrap">
    <div class="bt-header">
      <div class="bt-hlbl"></div>
      ${slots.map(s=>`<div class="bt-hlbl">${s}</div>`).join('')}
    </div>`;
  beds.forEach(bed=>{
    html+=`<div class="bt-row"><div class="bt-bed-lbl">🛏️ ${bed}號</div>`;
    slots.forEach(slot=>{
      const b=bookings.find(x=>x.bed===bed&&x.date===todayStr&&x.time===slot&&x.status!=='declined');
      if(b){
        const isDone=b.status==='done';

function submitManual(){
  const name=document.getElementById('mb-name').value.trim();
  const phone=document.getElementById('mb-phone').value.trim();
  const svcVal=document.getElementById('mb-svc').value;
  const date=document.getElementById('mb-date').value.trim();
  const time=document.getElementById('mb-time').value;
  const bed=parseInt(document.getElementById('mb-bed').value)||null;
  const therapistId=document.getElementById('mb-therapist').value;
  const note=document.getElementById('mb-note').value;
  const isNew=document.getElementById('mb-isnew').value==='1';
  if(!name||!phone||!svcVal||!date||!time){alert('請填寫必填欄位');return;}
  const [svcId,priceStr]=svcVal.split('_');
  const svcObj=SVCS.find(s=>s.id===parseInt(svcId));
  const priceObj=svcObj.prices.find(p=>p.p===parseInt(priceStr));
  const thObj=THERAPISTS.find(t=>t.id===therapistId);
  const bId='B'+Date.now().toString().slice(-4);
  const b={
    id:bId,custId:'MANUAL',name,phone,
    svc:svcObj.name,dur:priceObj.l,price:priceObj.p,
    date,time,bed,
    therapistId:therapistId==='none'?null:therapistId,
    therapistName:thObj?thObj.name:null,
    status:'accepted',
    lineId:document.getElementById('mb-line').value,
    note:note+(isNew?' ★新客人':''),
    acceptedBy:cur.user.id,
    acceptedAt:now(),
    isNew
  };
  bookings.unshift(b);
  // 更新或新增客人資料
  if(!customers.find(c=>c.phone===phone)){
    customers.push({id:'C'+Date.now().toString().slice(-3),name,phone,pw:'',lineId:b.lineId,bookCount:1,isNew:true});
  } else {
    const c=customers.find(x=>x.phone===phone);
    c.bookCount=(c.bookCount||0)+1;
    if(c.bookCount>=3) c.isVip=true;
  }
  fetch(LINE_CONFIG.backendUrl+'/api/notify/accepted',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({empId:cur.user.id,empName:cur.user.name,name,phone,svc:b.svc,dur:b.dur,date,time,price:b.price,note:b.note})
  }).catch(()=>{});
  toast('✅ 已為 '+name+' 建立預約！'+(isNew?'（新客人）':'')+' LINE通知發送中','sys','手動預約成功');
  swStaffTab('pending');
}

// ── 報表 ──
function renderStats(isBoss){
  const myId=cur.user.id;
  const showList=isBoss?employees:employees.filter(function(e){return e.id===myId;});
  const allDone=bookings.filter(function(b){return b.status==='done'||b.status==='accepted';});
  const totalRev=allDone.reduce(function(s,b){return s+b.price;},0);
  const todayStr='4/'+new Date().getDate();
  const todayRev=bookings.filter(function(b){return b.date===todayStr&&b.status!=='declined';}).reduce(function(s,b){return s+b.price;},0);
  const newCount=bookings.filter(function(b){return b.status==='new';}).length;

  const svcMap={};
  allDone.forEach(function(b){ svcMap[b.svc]=(svcMap[b.svc]||0)+b.price; });
  const svcList=Object.entries(svcMap).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  const maxRev=svcList[0]?svcList[0][1]:1;

  let html='<div class="report-cards">'
    +'<div class="report-card"><div class="rc-num">$'+(totalRev/1000).toFixed(1)+'k</div><div class="rc-lbl">總累積收入</div></div>'
    +'<div class="report-card"><div class="rc-num">$'+todayRev.toLocaleString()+'</div><div class="rc-lbl">今日收入</div></div>'
    +'<div class="report-card"><div class="rc-num">'+bookings.length+'</div><div class="rc-lbl">總預約數</div><div class="rc-sub">'+newCount+' 待確認</div></div>'
    +'<div class="report-card"><div class="rc-num">'+allDone.length+'</div><div class="rc-lbl">已完成案件</div></div>'
    +'</div>';

  html+='<div class="section-title">熱門療程排行</div><div class="chart-bar-wrap">';
  svcList.forEach(function(item){
    const pct=Math.round(item[1]/maxRev*100);
    html+='<div class="chart-bar-row">'
      +'<div class="chart-bar-lbl">'+item[0].slice(0,5)+'</div>'
      +'<div class="chart-bar-track"><div class="chart-bar-fill" style="width:'+pct+'%">$'+(item[1]/1000).toFixed(1)+'k</div></div>'
      +'</div>';
  });
  html+='</div>';

  html+='<div class="section-title">員工業績</div>'
    +'<div style="margin:0 0.9rem;background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;">'
    +'<table class="staff-tbl"><thead><tr><th>員工</th><th>接案</th><th>完成</th><th>金額</th></tr></thead><tbody>';

  showList.forEach(function(e){
    const myBooks=bookings.filter(function(b){return b.acceptedBy===e.id;});
    const done=myBooks.filter(function(b){return b.status==='done';}).length;
    const total=myBooks.reduce(function(s,b){return s+b.price;},0);
    const bossTag=e.role==='boss'?'<span class="boss-mark">老闆</span>':'';
    html+='<tr class="staff-row">'
      +'<td><div style="display:flex;align-items:center;gap:6px"><div class="emp-av">'+e.name[0]+'</div>'+e.name+bossTag+'</div></td>'
      +'<td style="font-weight:700;color:var(--pu)">'+myBooks.length+'</td>'
      +'<td style="color:var(--green)">'+done+'</td>'
      +'<td style="font-weight:700;color:var(--green)">$'+total.toLocaleString()+'</td>'
      +'</tr>';
  });
  html+='</tbody></table></div>';

  if(isBoss){
    const totalAll=bookings.filter(function(b){return b.status!=='declined';}).reduce(function(s,b){return s+b.price;},0);
    const totalCases=bookings.filter(function(b){return b.acceptedBy;}).length;
    html+='<div class="stats-grid" style="margin-top:0.5rem">'
      +'<div class="stat-c"><div class="stat-n">'+bookings.length+'</div><div class="stat-l">總預約數</div></div>'

      +'<div class="stat-c"><div class="stat-n">$'+(totalAll/1000).toFixed(1)+'k</div><div class="stat-l">總金額</div></div>'
      +'</div>';
  }
  return html;
}

// ── 客人名單 ──
function renderCustomers(isBoss){
  if(!isBoss) return '<div class="empty"><div class="empty-ico">🔒</div>僅老闆可查看客人名單</div>';
  const custMap={};
  bookings.forEach(function(b){
    if(!b.phone) return;
    if(!custMap[b.phone]) custMap[b.phone]={name:b.name,phone:b.phone,lineId:b.lineId,count:0,total:0,lastDate:''};
    if(b.status!=='declined'){custMap[b.phone].count++;custMap[b.phone].total+=b.price;}
    if(!custMap[b.phone].lastDate||b.date>custMap[b.phone].lastDate) custMap[b.phone].lastDate=b.date;
  });
  const list=Object.values(custMap).sort(function(a,b){return b.count-a.count;});
  if(!list.length) return '<div class="empty"><div class="empty-ico">👥</div>尚無客人資料</div>';
  let out = '<div class="section-title">客人名單（'+list.length+' 人）</div>'
    +'<div style="margin:0 0.9rem;background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;">';
  list.forEach(function(c){
    const tier=c.count>=5?'vip':c.count>=2?'regular':'new';
    const tierLbl={vip:'⭐ VIP',regular:'回頭客',new:'新客人'};
    const tierClass={vip:'cb-vip',regular:'cb-regular',new:'cb-new'};
    const lineInfo=c.lineId?' ・ '+c.lineId:'';
    out += '<div class="cust-row">'
      +'<div class="cust-av">'+c.name[0]+'</div>'
      +'<div class="cust-info">'
      +'<div class="cust-name">'+c.name+'</div>'
      +'<div class="cust-meta">📞 '+c.phone+lineInfo+' ・ 最近：'+c.lastDate+'</div></div>'
      +'<div style="text-align:right">'
      +'<div><span class="cust-badge '+tierClass[tier]+'">'+tierLbl[tier]+'</span></div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'+c.count+'次 ・ $'+c.total.toLocaleString()+'</div>'
      +'</div></div>';
  });
  out += '</div>';
  return out;
}

    btn.textContent = '×';
    btn.onclick = function(){ removeHoliday(d); };

    el.appendChild(span);

function addHoliday(){
  const d=document.getElementById('hol-date').value.trim();
  if(!d){alert('請輸入日期');return;}
  if(!holidays.includes(d)) holidays.push(d);
  renderStaffContent();
  setTimeout(renderHolidayChips, 50);
}

function removeHoliday(d){
  holidays=holidays.filter(x=>x!==d);
  renderStaffContent();
  setTimeout(renderHolidayChips, 50);
}
